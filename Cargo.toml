[package]
name = "github-work-inspector"
version = "0.2.1"
edition = "2021"
description = "Bounded, read-only GitHub repository snapshots for Codex"
publish = false
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
