<div id="gwi-overview" class="gwi">
<style>
#gwi-overview{--bg:var(--color-background-primary,#fff);--text:var(--color-text-primary,#17212b);--muted:var(--color-text-secondary,#526171);--border:var(--color-border-secondary,#bbc5cf);--accent:#2460ad;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box;max-width:100%}
#gwi-overview *{box-sizing:border-box;overflow-wrap:anywhere}#gwi-overview button,#gwi-overview input,#gwi-overview textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;max-width:100%}#gwi-overview button{cursor:pointer}#gwi-overview button:focus-visible{outline:3px solid var(--accent)}#gwi-overview button:disabled{opacity:.6;cursor:default}#gwi-overview .gwi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;margin:12px 0}#gwi-overview article{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:12px}#gwi-overview article[data-default=true]{border-width:2px 2px 2px 5px}#gwi-overview h2,#gwi-overview h3{font-size:16px;margin:0 0 6px}#gwi-overview p{margin:6px 0}#gwi-overview .gwi-muted{color:var(--muted);font-size:12px}#gwi-overview nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#gwi-overview pre{white-space:pre-wrap;font-size:12px;max-height:18rem;overflow:auto}#gwi-overview textarea{width:100%;min-height:7rem}#gwi-overview a{color:var(--accent)}#gwi-overview section{border-top:1px solid var(--border);padding:12px 0;margin-top:12px}#gwi-overview [hidden]{display:none!important}
@media(prefers-color-scheme:dark){#gwi-overview{--bg:var(--color-background-primary,#17212b);--text:var(--color-text-primary,#e5edf5);--muted:var(--color-text-secondary,#abbaca);--border:var(--color-border-secondary,#526171);--accent:#8fbdff}}
</style>
<h2>ブランチの内容を俯瞰</h2>
<p data-overview-repository></p><p data-overview-baseline></p>
<p data-overview-coverage class="gwi-muted" aria-live="polite"></p>
<p class="gwi-muted">枝のカード → 内容・根拠 →「詳しく聞く」。親SHA未取得の枝に履歴線は描きません。</p>
<label>全枝を検索 <input data-overview-search type="search" placeholder="枝名・内容・ファイル" /></label>
<nav><button data-overview-prev type="button">前へ</button><span data-overview-page aria-live="polite"></span><button data-overview-next type="button">次へ</button></nav>
<div data-overview-cards class="gwi-grid"></div>
<section data-overview-details hidden aria-live="polite"></section>
<section><p data-review-selection>枝を選択</p><button data-review-ask type="button" disabled>詳しく聞く</button><p data-review-status role="status"></p><textarea data-review-fallback readonly hidden aria-label="参照付き質問を手動コピー"></textarea></section>
<script>
/*__REVIEW_BUNDLE__*/
const gwiModel = /*__REVIEW_MODEL__*/;
GitHubReviewOverview.mount(document.getElementById('gwi-overview'), gwiModel);
</script>
</div>
