name: Dependency security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
cache-mode: none
jobs:
  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec advisory check (no automatic modification)
        run: cargo audit --deny warnings
